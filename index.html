<!doctype html>
<html lang="es">

    <!-- SEO Básico -->

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:site_name" content="Nexo Studio" />

    <meta
      property="og:image"
      content="/src/assets/images/hero_barbershop_studio_1795552060130.jpg"
    />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexo Studio | Barbería de Autor" />

      name="twitter:description"
      content="Cortes clásicos, degradados de precisión y cuidado de barba en un estudio privado. Coordina tu visita por WhatsApp."

      name="twitter:image"
      content="/src/assets/images/hero_barbershop_studio_1795552060130.jpg"
    />

    <!-- Tipografías editoriales: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Datos Estructurados Schema.org (JSON-LD) para negocio local.
      IMPORTANTE: Al publicar el sitio real, agrega los campos reales de
      "url", "telephone", "address" y "openingHoursSpecification" del negocio.
      Se omiten datos de contacto demostrativos para evitar indexar información no definitiva.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarberShop",
        "name": "Nexo Studio",
        "description": "Barbería de autor especializada en cortes clásicos, degradados de precisión, arreglo de barba y afeitado tradicional con atención individual de un maestro barbero.",
        "image": "/src/assets/images/hero_barbershop_studio_1795552060130.jpg",
        "serviceType": [
          "Corte clásico",
          "Degradado y diseño",
          "Corte y barba",
          "Arreglo de barba",
          "Afeitado clásico",
          "Diseño de cejas"
        ]
      }
    </script>
  </head>
  <body class="bg-cream text-charcoal antialiased selection:bg-copper/20 selection:text-charcoal">
